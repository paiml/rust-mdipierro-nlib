[package]
name = "nlib"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust port of Di Pierro's nlib — numerical algorithms with provable contracts"
license = "MIT"
repository = "https://github.com/paiml/rust-mdipierro-nlib"
authors = ["PAIML Engineering"]
keywords = ["numerical", "linear-algebra", "optimization", "monte-carlo", "provable"]
categories = ["mathematics", "science", "algorithms"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
# aprender 0.70.0-dev (car/0.70.0 @ 1274d040d): the 0.70 release train, pinned
# to a CI-green rev (never the moving branch). Move to v0.70.0 once tagged,
# then crates.io (GH-1).
aprender = { git = "https://github.com/paiml/aprender", rev = "1274d040de369d37bb2a9549af5816658dfb4856", default-features = false }

[dev-dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
