[package]
name = "nlib"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust port of Di Pierro's nlib — numerical algorithms with provable contracts"
license = "MIT"
repository = "https://github.com/paiml/rust-mdipierro-nlib"
authors = ["PAIML Engineering"]
keywords = ["numerical", "linear-algebra", "optimization", "monte-carlo", "provable"]
categories = ["mathematics", "science", "algorithms"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
# aprender 0.70.0-dev (fleet 0.70 dev @ d13f86934, the head of batch/ont-10), pinned
# by rev (never the moving branch). Move to main (or v0.70.0-rc.1) when ONT-10
# merges, then v0.70.0 once tagged, then crates.io (GH-1).
aprender = { git = "https://github.com/paiml/aprender", rev = "d13f8693440b140d7d75ee42b5d8ae3869a1f211", default-features = false }

[dev-dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
