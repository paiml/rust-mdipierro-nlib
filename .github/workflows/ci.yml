name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint-test:
    name: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --lib

      - name: Test
        run: cargo test --lib

  golden-vectors:
    name: Golden Vectors
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run golden vector tests
        run: cargo test --test golden_vectors

  parity:
    name: Python/Rust Parity
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6

      - name: Falsify Python/Rust parity
        run: uv run tests/falsify_parity.py

  kani:
    name: Kani BMC
    runs-on: ubuntu-latest
    needs: lint-test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: PLANT (GH-1, reverted before merge) a failing Kani step must turn gate red
        run: exit 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Kani
        run: |
          cargo install kani-verifier
          cargo kani setup

      - name: Verify harnesses
        run: |
          cargo kani --harness verify_transpose_involution
          cargo kani --harness verify_variance_non_negative
          cargo kani --harness verify_correlation_bounded
          cargo kani --harness verify_quicksort_sorted
          cargo kani --harness verify_quicksort_length
          cargo kani --harness verify_within_sound
          cargo kani --harness verify_simpson_rejects_odd_n

  # PRs: every mutant on a changed line must be caught (blocking).
  # main: full sweep, advisory until the pre-existing missed-mutant backlog
  # (114 in src/; see docs/ontology-conformance.md) is killed.
  mutants:
    name: Mutation Testing
    runs-on: ubuntu-latest
    needs: lint-test
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants

      - name: Mutants on the PR diff
        if: github.event_name == 'pull_request'
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff
          cargo mutants --no-shuffle -j4 --in-diff pr.diff -- --lib

      - name: Full mutation sweep (advisory)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: cargo mutants --no-shuffle -j4 -- --lib

  # Every example is an entity: its --json receipt must hold (exit 0) and be
  # byte-identical to the tracked evidence the SHACL shapes are checked on.
  examples:
    name: Examples
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Example falsification tests
        run: cargo test --test examples

      - name: Run every example and check its receipt against evidence
        run: |
          set -eu
          for ex in sort stats matrix solve optimize integrate fourier random monte_carlo graph parity; do
            echo "::group::cargo run --example $ex"
            cargo run -q --example "$ex"
            cargo run -q --example "$ex" -- --json > "receipt-$ex.json"
            diff -u "evidence/examples/$ex.json" "receipt-$ex.json"
            echo "::endgroup::"
          done

  contracts:
    name: Contract Validation
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install pv (aprender-contracts-cli at the pinned aprender rev)
        run: |
          rev=$(sed -n 's/^aprender = .*rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml)
          test -n "$rev"
          cargo install --locked --git https://github.com/paiml/aprender --rev "$rev" aprender-contracts-cli
          pv --version

      - name: Score contracts
        run: pv score contracts/ --binding contracts/binding.yaml

      # ONT-G: the gate proves itself first (19 cases against a stub pv, incl.
      # a mutant that must go green without the shapes_n probe).
      - name: Contracts gate self-test
        run: bash scripts/contracts_gate.sh --self-test

      # Every step runs, whatever an earlier one says: lint (all armed gates,
      # with --binding/--crate-dir, then the proof-level ratchet), shapes (fails
      # closed), regen (census, extract, the proof-status receipt), README sync
      # and example links, provenance, and a diff of every generated file.
      - name: Contracts gate
        run: bash scripts/contracts_gate.sh

  # Advisory until the repo-governance findings (branch protection, deny.toml,
  # roadmap/spec schema) are closed; see docs/ontology-conformance.md.
  comply:
    name: PMAT Comply (advisory)
    runs-on: ubuntu-latest
    needs: lint-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install pmat + pv
        run: |
          cargo install pmat
          rev=$(sed -n 's/^aprender = .*rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml)
          test -n "$rev"
          cargo install --locked --git https://github.com/paiml/aprender --rev "$rev" aprender-contracts-cli

      - name: Run pmat comply check
        run: pmat comply check

  # The org ruleset requires ONE check, `gate`, so this job is the only thing
  # GitHub enforces: it runs last, whatever happened (always()), and fails
  # unless every job it needs succeeded. Advisory jobs (PMAT Comply) stay out
  # of `needs`. scripts/ci_gate.sh --check-workflow fails if a job is neither
  # needed here nor marked continue-on-error, so no new job is silently optional.
  gate:
    name: gate
    if: always()
    needs: [lint-test, golden-vectors, parity, kani, mutants, examples, contracts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every blocking job is needed by the gate
        run: bash scripts/ci_gate.sh --check-workflow

      - name: Gate self-test
        run: bash scripts/ci_gate.sh --self-test

      - name: Every needed job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/ci_gate.sh --results
