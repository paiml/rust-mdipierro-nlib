metadata:
  version: 1.0.0
  created: '2026-09-27'
  author: PAIML Engineering
  kind: kernel
  valid_under:
    world: committed
  description: >
    examples/solve.rs as an entity. The example's `--json` receipt
    (evidence/examples/solve.json) is extracted by extract:json and must
    satisfy the closed shape below: exactly 5 checks, each naming one of this
    contract's equations, every one holding. A solver that stops early, a lost
    check or a stale receipt turns `pv lint --gate shapes` RED.
  references:
  - 'Di Pierro, M. (2013) Annotated Algorithms in Python: with Applications in Physics, Biology, and Finance. Experts4Solutions. ISBN 978-0991160402. §4.6 Solvers for nonlinear equations'
  - 'Burden & Faires (2015) Numerical Analysis, 10th Ed.'
  depends_on:
  - nonlinear-solvers-v1
relations:
  depends_on: [nonlinear-solvers-v1, example-receipt-v1]
entity:
  type: json
  ref: evidence/examples/solve.json
vocabulary:
  prefix: ex
  root_class: ex:SolveReceipt
  nested:
    checks: ex:Check
shape:
  targetClass: ex:SolveReceipt
  closed: true
  properties:
  - path: ex:example
    minCount: 1
    maxCount: 1
    in: [solve]
  - path: ex:source
    minCount: 1
    maxCount: 1
    in: [examples/solve.rs]
  - path: ex:contract
    minCount: 1
    maxCount: 1
    in: [example-solve-v1]
  - path: ex:n_checks
    minCount: 1
    maxCount: 1
    in: [5]
  - path: ex:all_pass
    minCount: 1
    maxCount: 1
    in: [true]
  - path: ex:checks
    minCount: 5
    maxCount: 5
    node:
      closed: true
      properties:
      - path: ex:id
        minCount: 1
        maxCount: 1
        pattern: '^EX-SOLVE-[0-9]{3}$'
      - path: ex:equation
        minCount: 1
        maxCount: 1
        in: [bisection_sqrt2, newton_cubic_residual, secant_sqrt2, solvers_agree, fixed_point_dottie]
      - path: ex:holds
        minCount: 1
        maxCount: 1
        in: [true]

equations:
  bisection_sqrt2:
    formula: '|bisection(x^2 - 2, 1, 2, 1e-12) - sqrt(2)| <= 1e-12'
    domain: 'f(x) = x^2 - 2 on [1, 2], f(1) < 0 < f(2)'
    codomain: 'bool: the bracketed root is sqrt(2) to the requested tolerance'
    preconditions:
    - 'f(a) * f(b) < 0'
    postconditions:
    - '|root - sqrt(2)| <= 1e-12'
    tolerance: 1.0e-12
  newton_cubic_residual:
    formula: '|f(newton(f, f'', 1.5, 1e-12))| <= 1e-12 for f(x) = x^3 - x - 2'
    domain: 'f(x) = x^3 - x - 2, x0 = 1.5 (root ~ 1.5214)'
    codomain: 'bool: the residual at the returned point is below the tolerance'
    preconditions:
    - 'f''(x) != 0 along the iteration'
    postconditions:
    - '|f(root)| <= 1e-12'
    tolerance: 1.0e-12
  secant_sqrt2:
    formula: '|secant(x^2 - 2, 1, 2, 1e-12) - sqrt(2)| <= 1e-12'
    domain: 'f(x) = x^2 - 2, x0 = 1, x1 = 2'
    codomain: 'bool: the secant iteration reaches sqrt(2)'
    preconditions:
    - 'f(x0) != f(x1)'
    postconditions:
    - '|root - sqrt(2)| <= 1e-12'
    tolerance: 1.0e-12
  solvers_agree:
    formula: '|bisection(x^2 - 2, 1, 2) - secant(x^2 - 2, 1, 2)| <= 1e-12'
    domain: 'the same equation solved two ways'
    codomain: 'bool: bracketing and open methods agree'
    preconditions:
    - 'both methods converge'
    postconditions:
    - '|r_bisection - r_secant| <= 1e-12'
    tolerance: 1.0e-12
  fixed_point_dottie:
    formula: '|fixed_point(cos, 1, 1e-12) - 0.7390851332151607| <= 1e-11'
    domain: 'g = cos, x0 = 1; |g''| = |sin x| < 0.68 near the fixed point (a contraction)'
    codomain: 'bool: the iteration reaches the Dottie number'
    preconditions:
    - '|g''(x)| < 1 near the fixed point'
    postconditions:
    - '|x - 0.7390851332151607| <= 1e-11 (step 1e-12 times 1/(1 - L), L ~ 0.68)'
    tolerance: 1.0e-11

proof_obligations:
- type: postcondition
  property: Every check in the receipt holds
  formal: 'receipt().all_pass() && receipt().checks.len() == 5'
  applies_to: bisection_sqrt2
- type: equivalence
  property: The tracked receipt is the example's current output
  formal: 'receipt().to_json() == evidence/examples/solve.json'
  applies_to: bisection_sqrt2
- type: bound
  property: The 1e-12 root bound discriminates a loosely converged solver
  formal: '|bisection(x^2 - 2, 1, 2, 1e-3) - sqrt(2)| > 1e-12'
  applies_to: bisection_sqrt2

falsification_tests:
- id: FALSIFY-EXSOLVE-001
  rule: bisection_sqrt2
  prediction: Every one of the 5 checks holds
  test: cargo test --test examples falsify_exsolve_001_all_checks_hold
  if_fails: A solver or its stopping rule regressed
- id: FALSIFY-EXSOLVE-002
  rule: bisection_sqrt2
  prediction: The tracked receipt equals the example's output byte for byte
  test: cargo test --test examples falsify_exsolve_002_receipt_matches_evidence
  if_fails: evidence/examples/solve.json is stale; regenerate it with --json
- id: FALSIFY-EXSOLVE-003
  rule: bisection_sqrt2
  prediction: A bisection stopped at tolerance 1e-3 fails the 1e-12 bound, so the check is not vacuous
  test: cargo test --test examples falsify_exsolve_003_loose_tolerance_fails
  if_fails: The root bound is too loose to catch an early stop
- id: FALSIFY-EXSOLVE-004
  rule: newton_cubic_residual
  prediction: The residual at the starting point 1.5 fails the bound
  test: cargo test --test examples falsify_exsolve_004_residual_discriminates
  if_fails: The residual check accepts a point that is not a root

kani_harnesses:
- id: KANI-RCPT-001
  obligation: Every check in the receipt holds
  property: 'within(got, want, tol) implies all three finite and tol >= 0; NaN never holds'
  bound: 1
  strategy: exhaustive
  harness: verify_within_sound

qa_gate:
  id: F-EXSOLVE-001
  name: example-solve-v1 Contract
  checks:
  - validation
  - falsification
  - shapes
